[package]
name = "forsaken-world-explorer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Free-flight viewer for a user-owned Forsaken World client"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
encoding_rs = "0.8"
flate2 = "1"
pollster = "0.4"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
