name: Release Windows package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify release source (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sh tools/check-core.sh

  release:
    name: Build and publish Windows release
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --bin forsaken-world-explorer
      - run: cargo check --locked --bins
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin forsaken-world-explorer
      - name: Stage portable release ZIP and checksums
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 `
            -Executable target/x86_64-pc-windows-msvc/release/forsaken-world-explorer.exe `
            -Modules Modules `
            -OutputDirectory release `
            -ArchivePath release/Forsaken-World-Explorer-Windows-x64.zip
      - name: Smoke run --self-test on packaged Windows executable
        shell: pwsh
        run: |
          & "./release/Forsaken World Explorer/forsaken-world-explorer.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged executable --self-test failed with exit code $LASTEXITCODE"
          }
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG_NAME `
            release/Forsaken-World-Explorer-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --title "Forsaken World Explorer $env:TAG_NAME" `
            --generate-notes
