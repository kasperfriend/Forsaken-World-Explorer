name: PR checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Linux checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run all cargo tests (lib and bins)
        run: cargo test --locked
      - name: Run dependency-free CPU core checks
        run: sh tools/check-core.sh
      - name: Run --self-test and --smoke-launch on Linux build
        run: |
          cargo run --locked --bin forsaken-world-explorer -- --self-test
          cargo run --locked --bin forsaken-world-explorer -- --smoke-launch

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  windows-build:
    name: Windows build, startup check, and package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Run library and viewer unit tests
        run: |
          cargo test --locked --lib
          cargo test --locked --bin forsaken-world-explorer
      - name: Check all binary targets
        run: cargo check --locked --bins
      - name: Build Windows release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin forsaken-world-explorer
      - name: Stage portable ZIP and SHA256SUMS.txt
        shell: pwsh
        run: |
          ./tools/package-windows.ps1 `
            -Executable target/x86_64-pc-windows-msvc/release/forsaken-world-explorer.exe `
            -Modules Modules `
            -OutputDirectory release `
            -ArchivePath release/Forsaken-World-Explorer-Windows-x64.zip
      - name: Smoke run --self-test and --smoke-launch on packaged Windows executable
        shell: pwsh
        run: |
          $exe = "./release/Forsaken World Explorer/forsaken-world-explorer.exe"
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged executable --self-test failed with exit code $LASTEXITCODE"
          }
          & $exe --smoke-launch
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged executable --smoke-launch failed with exit code $LASTEXITCODE"
          }
      - name: Verify packaged Windows executable starts without crashing
        shell: pwsh
        run: |
          $exe = (Resolve-Path "./release/Forsaken World Explorer/forsaken-world-explorer.exe").Path
          $stdoutLog = Join-Path $env:TEMP "fw-launch-stdout.log"
          $stderrLog = Join-Path $env:TEMP "fw-launch-stderr.log"
          $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            $code = $proc.ExitCode
            $err = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { '' }
            if ($code -ne 0) {
              throw "forsaken-world-explorer.exe exited immediately with code ${code}: $err"
            }
            Write-Host "forsaken-world-explorer.exe exited cleanly with code 0"
          } else {
            Write-Host "forsaken-world-explorer.exe stayed running cleanly for 3s (PID $($proc.Id)); stopping."
            Stop-Process -Id $proc.Id -Force
          }
      - name: Verify SHA256SUMS.txt matches packaged files
        shell: pwsh
        run: |
          $root = Resolve-Path "./release/Forsaken World Explorer"
          $lines = Get-Content (Join-Path $root 'SHA256SUMS.txt') | Where-Object { $_.Trim().Length -gt 0 }
          foreach ($line in $lines) {
            $parts = $line -split '\s+', 2
            $expected = $parts[0].ToLowerInvariant()
            $rel = $parts[1]
            $actual = (Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Checksum mismatch for ${rel}: expected $expected, got $actual"
            }
          }
          Write-Host "Verified $($lines.Count) file checksums in SHA256SUMS.txt"
      - name: Upload Windows portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forsaken-World-Explorer-Windows-x64
          path: |
            release/Forsaken-World-Explorer-Windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
